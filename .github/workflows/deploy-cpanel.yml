name: Deploy to cPanel

# Ships a push to `main` to the cPanel shared host: build on the runner, push
# with rsync over SSH, migrate, then smoke-test the live site.
#
# Why build here instead of on the server: composer is not guaranteed on cPanel
# accounts, the host's PHP CLI is often the wrong version, and `npm run build`
# needs Node + Tailwind. vendor/ and public/assets/ are gitignored, so they have
# to be produced somewhere — the runner is the only place they are guaranteed.
#
# Maintenance mode: `runtime/maintenance.lock` goes up just before the transfer
# and comes down once the live site answers, so visitors get a page instead of
# a fatal error for the few seconds the tree is inconsistent. If a deploy dies
# in between the lock deliberately stays, and the `clear_maintenance` dispatch
# input takes the site back out by hand.
#
# Secrets (Settings → Secrets and variables → Actions):
#   CPANEL_HOST      e.g. srv123.cpanel.net   (the host from cPanel's "Connect
#                       via SSH" box — the IP changes, the hostname does not)
#   CPANEL_USER      cPanel account name, e.g. the username cPanel logs you in with
#   CPANEL_SSH_KEY   the PRIVATE key of the public key added in
#                     cPanel → SSH Access → Manage SSH Keys
# Optional:
#   CPANEL_ENV_B64   base64 of a .env to seed the server with, written only
#                     when the server has no .env yet (never overwritten)
#   CPANEL_PHP_BIN   PHP CLI on the host; auto-detected when unset
# Variables (Settings → Secrets and variables → Actions → Variables):
#   CPANEL_PATH      app root on the server, e.g. /home/user/allseba/alif_tools
#   DEPLOY_HEALTH_URL  URL polled after deploy (default https://allseba.dgtts.org)
#   CPANEL_SSH_PORT  default 22

on:
  push:
    branches: [main]
    # Deploy for anything the running site actually depends on. Android/TWA and
    # docs changes are real commits but do not change a PHP file on the host,
    # and each deploy costs a full rsync + migration run.
    paths-ignore:
      - 'android/**'
      - 'twa/**'
      - 'docs/**'
      - 'tests/**'
      - '**/*.md'
      - '.github/workflows/android-apk.yml'
      - '.kilo/**'
      - '.freebuff/**'
  workflow_dispatch:
    inputs:
      clear_maintenance:
        description: >-
          Only remove runtime/maintenance.lock from the server and verify the
          site. Use this when a deploy failed midway and left the site in
          maintenance mode.
        type: boolean
        default: false

# cancel-in-progress is deliberately false: an rsync cut in half leaves the
# live site with a partial vendor/ and a broken autoloader. Let it finish.
concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Read from a repository variable, never hardcoded here: this file lives in a
  # public repository, and a cPanel username written into it is permanent once
  # pushed — a free gift to anyone brute-forcing the panel. The app path also
  # contains that username by construction (/home/<user>/...), so there is no
  # version of this default worth keeping.
  DEPLOY_PATH: ${{ vars.CPANEL_PATH }}
  HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'https://allseba.dgtts.org' }}

jobs:
  # Emergency exit from maintenance mode. A deploy that dies between "enable"
  # and "disable" leaves the lock on purpose — a readable page beats a fatal
  # error — but that also means someone has to take the site back out of
  # maintenance by hand, and SSH plus a human is a slow way to do it.
  clear-maintenance:
    name: clear maintenance lock
    if: inputs.clear_maintenance == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up SSH
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
          CPANEL_SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          key="$HOME/.ssh/deploy_key"

          if [ -n "$CPANEL_SSH_KEY_B64" ]; then
            if ! printf '%s' "$CPANEL_SSH_KEY_B64" | tr -d ' \t\r\n' | base64 --decode | tr -d '\r' > "$key" 2>/dev/null; then
              echo "::error::CPANEL_SSH_KEY_B64 is not valid base64."
              exit 1
            fi
            key_source="CPANEL_SSH_KEY_B64"
          elif [ -n "$CPANEL_SSH_KEY" ]; then
            printf '%s' "$CPANEL_SSH_KEY" | tr -d '\r' \
              | sed -n '/-----BEGIN [A-Z ]*PRIVATE KEY-----/,/-----END [A-Z ]*PRIVATE KEY-----/p' \
              > "$key"
            key_source="CPANEL_SSH_KEY"
          else
            echo "::error::No SSH key secret. Set CPANEL_SSH_KEY_B64 (preferred) or CPANEL_SSH_KEY."
            exit 1
          fi

          if [ -n "$(tail -c 1 "$key")" ]; then
            printf '\n' >> "$key"
          fi
          chmod 600 "$key"

          if [ ! -s "$key" ]; then
            # The common cause by far: the secret is not a private key at all.
            # Without this branch the symptom is "0 bytes" and a blank line,
            # which says nothing about what was actually pasted.
            echo "::error::No private key found in $key_source."
            [ "$key_source" = "CPANEL_SSH_KEY" ] && \
              echo "::error::That secret has no '-----BEGIN ... PRIVATE KEY-----' block, so nothing was extracted."
            echo "::error::It is most likely one of:"
            echo "::error::  - the PUBLIC key (.pub, or a line starting ssh-ed25519/ssh-rsa)"
            echo "::error::  - a PuTTY key (.ppk) — convert it first:"
            echo "::error::      puttygen old.ppk -O private-openssh -o new.key"
            echo "::error::  - the base64 form pasted into the plain-key field"
            echo "::error::For the base64 form use CPANEL_SSH_KEY_B64 instead:"
            echo "::error::      base64 -w0 <keyfile>"
            exit 1
          fi

          if ! ssh-keygen -y -P '' -f "$key" > /dev/null 2>"$RUNNER_TEMP/key.err"; then
            echo "::error::The deploy key is not a usable private key (from $key_source)."
            echo "::error::bytes=$(wc -c < "$key") lines=$(wc -l < "$key")"
            echo "::error::first line: $(head -1 "$key" | cut -c1-40)"
            echo "::error::last line:  $(tail -1 "$key" | cut -c1-40)"
            echo "::error::A key with a passphrase cannot be used here — cPanel's SSH keys have none either."
            head -3 "$RUNNER_TEMP/key.err" | sed 's/^/::error::  /'
            exit 1
          fi

          ssh-keyscan -p "$CPANEL_SSH_PORT" "$CPANEL_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host cpanel
            HostName $CPANEL_HOST
            User $CPANEL_USER
            Port $CPANEL_SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Remove the lock and confirm the site is live
        run: |
          set -euo pipefail
          env_q=$(printf '%q' "$DEPLOY_PATH")
          ssh cpanel "DEPLOY_PATH=$env_q bash -s" <<'REMOTE'
          set -euo pipefail
          if [ -f "$DEPLOY_PATH/runtime/maintenance.lock" ]; then
            rm -f "$DEPLOY_PATH/runtime/maintenance.lock"
            echo "::notice::maintenance.lock removed"
          else
            echo "No maintenance.lock — nothing to clear."
          fi
          REMOTE
          # A cleared lock is not proof of a healthy site: if the deploy that
          # failed left a half-written vendor/, the real error only shows up
          # here. Report it rather than calling it green.
          #
          # No -L here either, for the same reason as the deploy's own health
          # check: a redirect to an unrelated site is not this app coming back.
          code=$(curl -sS -o /dev/null -D "$RUNNER_TEMP/live.headers" \
            -w '%{http_code}' --max-time 30 "$HEALTH_URL" || echo 000)
          echo "$HEALTH_URL → $code"
          if [ "$code" != "200" ]; then
            location=$(grep -i '^location:' "$RUNNER_TEMP/live.headers" | tail -1 | tr -d '\r' || true)
            # An `if`, not a `[ … ] && echo`: under `set -e` a failing test at
            # the end of a list would exit the step here, before the message
            # below the actual problem could be printed.
            if [ -n "$location" ]; then
              echo "::error::$HEALTH_URL redirects to ${location#*: } — the health URL is not being served by this deployment."
            fi
            echo "::error::The lock is cleared but the site does not answer — the previous deploy is still broken."
            exit 1
          fi

  deploy:
    name: build & ship
    # Skipped when the operator asked only to clear the lock. On a push,
    # `inputs` is null and `null != true` is true, so normal deploys run.
    if: inputs.clear_maintenance != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gives the job a place to hang a manual approval or restrict it to
    # `main` branches, without editing this file.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy secrets are set
        # A missing secret here would otherwise surface as "Permission denied
        # (publickey)" twenty steps later.
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
          CPANEL_PATH: ${{ vars.CPANEL_PATH }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$CPANEL_HOST" ] || missing+=("secret CPANEL_HOST")
          [ -n "$CPANEL_USER" ] || missing+=("secret CPANEL_USER")
          # Either form of the key is enough; B64 is the one that cannot be
          # corrupted by the secrets UI, so it is the one to reach for first.
          if [ -z "$CPANEL_SSH_KEY_B64" ] && [ -z "$CPANEL_SSH_KEY" ]; then
            missing+=("secret CPANEL_SSH_KEY_B64 or CPANEL_SSH_KEY")
          fi
          # CPANEL_PATH has no default on purpose — see the env block above.
          [ -n "$CPANEL_PATH" ] || missing+=("variable CPANEL_PATH")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository:"
            for m in "${missing[@]}"; do echo "::error::  - $m"; done
            echo "::error::CPANEL_PATH must be the app root, e.g. /home/<cpanel-user>/<app>."
            exit 1
          fi
          echo "Deploying as $CPANEL_USER@$CPANEL_HOST:$DEPLOY_PATH"

      # ---------------------------------------------------------------- build

      - name: Install PHP dependencies
        uses: shivammathur/setup-php@v2
        with:
          # composer.json requires "php": "8.2 - 8.5"; 8.2 is the lowest, which
          # is what a shared host is most likely to run.
          php-version: '8.2'
          # ext-filter/mbstring/openssl ship with the extension and are not
          # installable by name.
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Composer install (production autoloader)
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-progress

      - name: Build front-end assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # package-lock.json is committed, so the cache key is stable.
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Smoke-test the console application
        # A build that produces files but cannot boot Yii is worthless as a
        # deploy: it would only be discovered after rsync, when migrations run.
        # `yii` with no arguments lists commands, which loads the DI container
        # and every config file without touching the database.
        run: php yii list

      # ------------------------------------------------------------------ ssh

      - name: Set up SSH
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
          CPANEL_SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          key="$HOME/.ssh/deploy_key"

          # A secret is a single-line text field, and a private key pasted into
          # one arrives with whatever the source had: CRLF from a Windows
          # editor, quotes from a shell command, a missing final newline. Each
          # of those produces the same useless `error in libcrypto`, so the key
          # is decoded, trimmed and *parsed* here — before the first ssh call —
          # and a bad one fails with something a human can act on.
          if [ -n "$CPANEL_SSH_KEY_B64" ]; then
            # Preferred: base64 cannot be corrupted by the secrets UI. The
            # decoded text still needs CR stripping, because the key file it
            # came from may well have been generated on Windows.
            if ! printf '%s' "$CPANEL_SSH_KEY_B64" | tr -d ' \t\r\n' | base64 --decode | tr -d '\r' > "$key" 2>/dev/null; then
              echo "::error::CPANEL_SSH_KEY_B64 is not valid base64."
              exit 1
            fi
            key_source="CPANEL_SSH_KEY_B64"
          elif [ -n "$CPANEL_SSH_KEY" ]; then
            printf '%s' "$CPANEL_SSH_KEY" | tr -d '\r' \
              | sed -n '/-----BEGIN [A-Z ]*PRIVATE KEY-----/,/-----END [A-Z ]*PRIVATE KEY-----/p' \
              > "$key"
            key_source="CPANEL_SSH_KEY"
          else
            echo "::error::No SSH key secret. Set CPANEL_SSH_KEY_B64 (preferred) or CPANEL_SSH_KEY."
            exit 1
          fi

          # A key file whose last line has no newline is rejected by OpenSSH
          # even when every byte of the key is correct.
          if [ -n "$(tail -c 1 "$key")" ]; then
            printf '\n' >> "$key"
          fi
          chmod 600 "$key"

          if [ ! -s "$key" ]; then
            # The common cause by far: the secret is not a private key at all.
            # Without this branch the symptom is "0 bytes" and a blank line,
            # which says nothing about what was actually pasted.
            echo "::error::No private key found in $key_source."
            [ "$key_source" = "CPANEL_SSH_KEY" ] && \
              echo "::error::That secret has no '-----BEGIN ... PRIVATE KEY-----' block, so nothing was extracted."
            echo "::error::It is most likely one of:"
            echo "::error::  - the PUBLIC key (.pub, or a line starting ssh-ed25519/ssh-rsa)"
            echo "::error::  - a PuTTY key (.ppk) — convert it first:"
            echo "::error::      puttygen old.ppk -O private-openssh -o new.key"
            echo "::error::  - the base64 form pasted into the plain-key field"
            echo "::error::For the base64 form use CPANEL_SSH_KEY_B64 instead:"
            echo "::error::      base64 -w0 <keyfile>"
            exit 1
          fi

          if ! ssh-keygen -y -P '' -f "$key" > /dev/null 2>"$RUNNER_TEMP/key.err"; then
            echo "::error::The deploy key is not a usable private key (from $key_source)."
            echo "::error::bytes=$(wc -c < "$key") lines=$(wc -l < "$key")"
            echo "::error::first line: $(head -1 "$key" | cut -c1-40)"
            echo "::error::last line:  $(tail -1 "$key" | cut -c1-40)"
            echo "::error::A key with a passphrase cannot be used here — cPanel's SSH keys have none either."
            head -3 "$RUNNER_TEMP/key.err" | sed 's/^/::error::  /'
            echo "::error::Re-create it as: base64 -w0 <keyfile>   (no passphrase, no quotes)"
            exit 1
          fi
          echo "Deploy key OK ($key_source): $(ssh-keygen -lf "$key" | awk '{print $2}')"

          # ssh-keyscan pins nothing on its own — it trusts whatever answers on
          # port 22. The host still has to be yours (see note in the summary),
          # but this avoids shipping a hard-coded host key that goes stale.
          ssh-keyscan -p "$CPANEL_SSH_PORT" "$CPANEL_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host cpanel
            HostName $CPANEL_HOST
            User $CPANEL_USER
            Port $CPANEL_SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config
          ssh -o BatchMode=yes cpanel 'echo "SSH OK: $(pwd)"'

      # ---------------------------------------------------------------- deploy

      - name: Prepare the deploy directory on the server
        id: prepare
        run: |
          set -euo pipefail
          # The heredoc below is quoted, so nothing is expanded locally and the
          # remote shell does the expanding. That means secrets have to be
          # handed over on the ssh command line — printf %q keeps a value with
          # quotes, spaces or a `$` in it intact instead of breaking the shell.
          env_q=$(printf '%q' "$DEPLOY_PATH")
          b64_q=$(printf '%q' "$CPANEL_ENV_B64")
          output=$(ssh cpanel "DEPLOY_PATH=$env_q CPANEL_ENV_B64=$b64_q bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH"
          # rsync is the better transfer (incremental, one pass, built-in
          # pruning) but plenty of shared hosts ship without it, and it is not
          # installable from the workflow. tar is in every base image, so the
          # transfer degrades to a tar-over-SSH stream instead of failing.
          if command -v rsync >/dev/null; then
            echo "::transfer::rsync"
          else
            command -v tar >/dev/null || { echo "::error::neither rsync nor tar is available on the host"; exit 1; }
            echo "::warning::rsync is not installed on this host; falling back to a tar transfer."
            echo "::transfer::tar"
          fi

          # Writable state that lives only on the server. Created up front so
          # the app never has to guess, and so a half-empty first deploy still
          # comes up (uploads, logs, cache, VAPID/secret scratch space).
          mkdir -p "$DEPLOY_PATH"/{runtime/cache,runtime/logs,storage,cache,web/receipts,web/deliverables,web/releases}
          chmod 750 "$DEPLOY_PATH/runtime" "$DEPLOY_PATH/runtime/logs" "$DEPLOY_PATH/runtime/cache" "$DEPLOY_PATH/storage" "$DEPLOY_PATH/cache"

          # Seed .env on a first deploy only. Overwriting it on every run
          # would silently revert a rotated DB password or APP_KEY.
          if [ ! -f "$DEPLOY_PATH/.env" ] && [ -n "${CPANEL_ENV_B64:-}" ]; then
            printf '%s' "$CPANEL_ENV_B64" | base64 --decode > "$DEPLOY_PATH/.env.tmp"
            chmod 600 "$DEPLOY_PATH/.env.tmp"
            mv "$DEPLOY_PATH/.env.tmp" "$DEPLOY_PATH/.env"
            echo "Seeded .env from the CPANEL_ENV_B64 secret."
          fi

          # Report the web-root wiring without touching it. A cPanel subdomain
          # serves ~/public_html by default, while the app lives in
          # $DEPLOY_PATH — so the one-time cPanel step that points the
          # document root at $DEPLOY_PATH/public is what makes the domain
          # serve this app at all. Report both facts, because "the deploy
          # was green and the site shows something else" is otherwise
          # undiagnosable from the log.
          [ -f "$DEPLOY_PATH/public/index.php" ] \
            || echo "::warning::$DEPLOY_PATH/public/index.php is missing — the release did not land."
          link=$(readlink -f "$HOME/public_html" 2>/dev/null || echo "(not a symlink or not present)")
          echo "public_html -> $link"
          case "$link" in
            "$DEPLOY_PATH/public"|"$DEPLOY_PATH/public/"|"$DEPLOY_PATH")
              echo "public_html points inside the release: OK" ;;
            *)
              echo "::warning::public_html is $link, outside $DEPLOY_PATH/public."
              echo "::warning::If the domain serves the wrong site, fix it in cPanel: Domains -> the subdomain -> Document Root = $DEPLOY_PATH/public (or symlink ~/public_html to it). The deploy itself cannot change the vhost." ;;
          esac
          REMOTE
          )
          # Everything the remote script printed except the marker is
          # diagnostics — the public_html wiring, the .env seed notice, the
          # rsync/tar warning. Command substitution swallowed all of it, so a
          # docroot pointing outside DEPLOY_PATH (the single most common
          # "the deploy succeeded but the site is not this app" cause) never
          # reached the log. Replay it, with the marker stripped.
          # Replayed verbatim, not indented: a leading space stops GitHub
          # parsing the line as a workflow command, which would turn a
          # ::warning:: back into invisible plain text.
          printf '%s\n' "$output" | grep -v '^::transfer::' || true
          # Picked out by marker rather than by "last line", because the
          # script above prints warnings and notices of its own.
          transfer=$(printf '%s\n' "$output" | sed -n 's/^::transfer:://p' | tail -1)
          if [ -z "$transfer" ]; then
            echo "::error::Could not determine how to transfer the release."
            exit 1
          fi
          echo "transfer=$transfer" >> "$GITHUB_OUTPUT"
          echo "Transfer mode: $transfer"
        env:
          # Empty string, not unset, when the secret is absent: the remote
          # script's `${CPANEL_ENV_B64:-}` guard treats both the same.
          CPANEL_ENV_B64: ${{ secrets.CPANEL_ENV_B64 }}

      # Placed *after* the prepare step on purpose: the lock lives in
      # runtime/, which is one of the directories that step creates, and there
      # is no reason to hold the site while the runner builds assets either.
      - name: Enable maintenance mode
        env:
          REASON: Deploying ${{ github.sha }}
        run: |
          set -euo pipefail
          env_q=$(printf '%q' "$DEPLOY_PATH")
          reason_q=$(printf '%q' "$REASON")
          ssh cpanel "DEPLOY_PATH=$env_q REASON=$reason_q bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH/runtime"
          # First line of this file is shown on the page, so keep it to one
          # line: a printf without a newline would leave the site's shell
          # prompt glued to the reason on a failed deploy.
          printf '%s\n' "$REASON" > "$DEPLOY_PATH/runtime/maintenance.lock"
          chmod 640 "$DEPLOY_PATH/runtime/maintenance.lock"
          echo "Maintenance mode on: $(cat "$DEPLOY_PATH/runtime/maintenance.lock")"
          REMOTE

      - name: Transfer the release
        env:
          TRANSFER_MODE: ${{ steps.prepare.outputs.transfer }}
        run: |
          set -euo pipefail
          # One list of names, rendered into the two syntaxes the tools
          # disagree about: rsync matches `docs/` against a transfer-relative
          # path, while GNU tar matches `./docs` against the member name it
          # stored. Deriving both from the same names is what keeps rsync and
          # tar mode from shipping different files.
          #
          # vendor/ and public/assets/* are deliberately absent: they are
          # gitignored, built in the steps above, and wanted on the server.
          #
          # The .env / runtime / storage / web upload rules are also what keeps
          # the transfer from destroying server-only state — rsync protects
          # excluded paths from --delete, and the tar path never touches them.
          dirs=".git .github .kilo .freebuff node_modules runtime storage cache web/receipts web/deliverables web/releases android twa docs tests scripts/__pycache__"
          files=".env .deploy-manifest .deploy-manifest.old codeception.yml psalm.xml rector.php package.json package-lock.json tailwind.config.js .gitignore README.md"

          rsync_ex=$(mktemp)
          tar_ex=$(mktemp)
          for d in $dirs; do printf '%s/\n' "$d" >> "$rsync_ex"; printf './%s\n' "$d" >> "$tar_ex"; done
          for f in $files; do printf '%s\n' "$f" >> "$rsync_ex"; printf './%s\n' "$f" >> "$tar_ex"; done
          printf '*.log\n' >> "$rsync_ex"
          printf './*.log\n' >> "$tar_ex"

          if [ "$TRANSFER_MODE" = rsync ]; then
            rsync \
              --archive \
              --compress \
              --delete \
              --delete-delay \
              --partial \
              --human-readable \
              --info=stats2 \
              --timeout=600 \
              --exclude-from="$rsync_ex" \
              ./ cpanel:"$DEPLOY_PATH/"
          else
            # No rsync on the host: ship a tarball over the SSH channel. It is
            # one big sequential write instead of an incremental diff, but it
            # works everywhere and needs nothing installed.
            #
            # The tarball is built in RUNNER_TEMP, deliberately *outside* the
            # tree: writing release.tgz into the directory being archived
            # changes that directory mid-read, and GNU tar reacts by aborting
            # with "file changed as we read it".
            tarball="$RUNNER_TEMP/release.tgz"
            manifest="$RUNNER_TEMP/manifest.txt"
            echo "Building a tar release…"
            tar -czf "$tarball" --exclude-from="$tar_ex" .

            # The member list of that exact tarball is the manifest of what we
            # shipped, so the next deploy can remove files the release no longer
            # contains — the one thing plain tar-overwrite cannot do.
            tar -tzf "$tarball" \
              | sed 's|^\./||' \
              | grep -v '/$' \
              | LC_ALL=C sort > "$manifest"
            echo "Release contains $(wc -l < "$manifest") files."

            path_q=$(printf '%q' "$DEPLOY_PATH")
            # Keep the previous manifest before the new one lands; the prune
            # step below needs it to know what used to be there.
            ssh cpanel "cd $path_q && mv -f .deploy-manifest .deploy-manifest.old 2>/dev/null || true"
            # The compressed stream goes over as-is and the remote tar's own
            # -z unpacks it. Decompressing here as well would feed tar plain
            # bytes and it would fail with "gzip: stdin: not in gzip format".
            cat "$tarball" | ssh cpanel "tar -xzf - -C $path_q --no-same-owner"
            ssh cpanel "cat > $path_q/.deploy-manifest" < "$manifest"
            echo "Transfer complete ($(du -h "$tarball" | cut -f1) compressed)."
          fi

          # release.tgz is a build artifact of this run, not source.
          rm -f "$rsync_ex" "$tar_ex"

      - name: Prune files this release dropped
        # tar cannot delete, so stale code from the previous release would
        # otherwise sit next to the new one forever. The manifest makes the
        # deletion precise: only files this project shipped, that the new
        # release no longer contains, and that are not server state.
        if: steps.prepare.outputs.transfer == 'tar'
        run: |
          set -euo pipefail
          env_q=$(printf '%q' "$DEPLOY_PATH")
          ssh cpanel "DEPLOY_PATH=$env_q bash -s" <<'REMOTE'
          # Deliberately not `set -e`: removing leftovers must never be able to
          # fail a deploy whose code is already on disk and correct.
          set -uo pipefail
          cd "$DEPLOY_PATH"
          if [ ! -f .deploy-manifest.old ]; then
            echo "No previous manifest — nothing to prune."
            exit 0
          fi
          if [ ! -f .deploy-manifest ]; then
            echo "::warning::No current manifest; skipping the prune."
            exit 0
          fi
          removed=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              .env|runtime/*|storage/*|cache/*|web/receipts/*|web/deliverables/*|web/releases/*|.deploy-manifest*) continue ;;
            esac
            if [ -f "$f" ] && ! grep -qxF -- "$f" .deploy-manifest; then
              rm -f -- "$f" && removed=$((removed + 1))
            fi
          done < .deploy-manifest.old
          rm -f .deploy-manifest.old
          echo "Pruned $removed file(s) left behind by the previous release."
          REMOTE

      # ------------------------------------------------------------ aftercare

      - name: Clear cache and run migrations
        run: |
          set -euo pipefail
          env_q=$(printf '%q' "$DEPLOY_PATH")
          php_q=$(printf '%q' "$CPANEL_PHP_BIN")
          ssh cpanel "DEPLOY_PATH=$env_q CPANEL_PHP_BIN=$php_q bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # cPanel's default php is often 7.x. Probe the usual locations and
          # fall back, so a wrong guess is a one-line override instead of a
          # failed deploy.
          PHP_BIN=""
          for candidate in "${CPANEL_PHP_BIN:-}" /opt/cpanel/ea-php82/root/usr/bin/php /usr/local/bin/php /usr/bin/php; do
            if [ -n "$candidate" ] && command -v "$candidate" >/dev/null 2>&1; then
              PHP_BIN="$candidate"
              break
            fi
          done
          [ -n "$PHP_BIN" ] || { echo "::error::No PHP binary found on the host"; exit 1; }
          echo "Using $PHP_BIN ($("$PHP_BIN" -r 'echo PHP_VERSION;'))"

          # Config and route caches are stale the moment a file changed, and a
          # stale config cache is the documented cause of "404 on every page
          # after a deploy".
          rm -rf runtime/cache/*

          # migrate:up is idempotent — a deploy with no new migrations prints
          # "Nothing to migrate" and exits 0. --no-interaction keeps a
          # confirmation prompt from hanging a cron-less shell.
          "$PHP_BIN" yii migrate:up --no-interaction

          # The migration run itself recompiles config through the cache dir, so
          # wipe it again afterwards. (There is no `cache/flush` command in this
          # app — `php yii list` shows only migrate:*, app:*, serve and friends —
          # so deleting the directory is the flush.)
          rm -rf runtime/cache/*

          # Code lands as the deploying user, so it is already correct, but the
          # dirs recreated by the prepare step are not — without this a later
          # rsync run and Apache disagree about who may write the logs. The
          # mkdir -p is not paranoia: `set -e` turns a chmod on a directory
          # that is somehow absent into a red deploy for a site that is
          # otherwise perfectly healthy.
          mkdir -p runtime/cache runtime/logs storage cache
          chmod 750 runtime runtime/cache runtime/logs storage cache
          REMOTE
        env:
          CPANEL_PHP_BIN: ${{ vars.CPANEL_PHP_BIN }}

      - name: Verify the site answers
        # Advisory only. Migrations can succeed and the app can still 500 (a
        # bad .env, a missing extension, a half-synced vendor dir), so it is
        # worth checking — but the check must never be what fails a deploy.
        # It runs on the runner against a URL the runner resolves, and the
        # things that break it (a domain parked elsewhere, DNS still
        # propagating, a CDN in front of the host) are not evidence about the
        # code that was just transferred. continue-on-error also keeps the
        # `if: failure()` step below from firing, which matters: this step
        # removes the maintenance lock, so a "failed" health check would
        # otherwise re-lock a site that is actually serving.
        continue-on-error: true
        run: |
          set -euo pipefail
          env_q=$(printf '%q' "$DEPLOY_PATH")
          ssh cpanel "DEPLOY_PATH=$env_q bash -s" <<'REMOTE'
          set -euo pipefail
          rm -f "$DEPLOY_PATH/runtime/maintenance.lock"
          echo "Maintenance mode off."
          REMOTE

          # Three tries: the first request after a deploy can still lose a race
          # with an opcache reset or a Cloudflare fetch, and locking the site
          # again over a single flaky 502 would be worse than waiting.
          #
          # No -L. Following redirects here is how a deploy verifies a site
          # that is not this one: a domain parked on a WordPress install that
          # 301s somewhere else answers 200 for "/" and 404s for "/login",
          # which reads exactly like a broken application. The status code of
          # the URL we asked for is the only thing that says anything about
          # what we deployed, and a redirect is not a 200 — it is the domain
          # pointing somewhere the operator has to look at.
          ok=1
          for attempt in 1 2 3; do
            for path in / /login; do
              url="$HEALTH_URL$path"
              # -D dumps the response headers so a redirect's Location can be
              # named in the log; -w pulls the code and the URL curl ended on.
              code=$(curl -sS -o /dev/null -D "$RUNNER_TEMP/health.headers" \
                -w '%{http_code}' --max-time 30 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "[attempt $attempt] $url → 200"
                continue
              fi
              echo "[attempt $attempt] $url → $code"
              # A 3xx is a domain misconfiguration, not a slow start, so it is
              # worth naming rather than retrying three times before failing.
              location=$(grep -i '^location:' "$RUNNER_TEMP/health.headers" | tail -1 | tr -d '\r' || true)
              if [ -n "$location" ]; then
                echo "::warning::$url redirects to ${location#*: } — the health URL is not being served by this deployment."
              fi
              ok=0
              break
            done
            [ "$ok" = "1" ] && break
            sleep 10
          done

          if [ "$ok" != "1" ]; then
            # Warnings, not errors, and no non-zero exit: this step is a
            # smoke test for a human reading the log, not a gate. The
            # diagnosis lines are the whole point of the check.
            echo "::warning::$HEALTH_URL does not serve this app after the deploy."
            echo "::warning::Check that the domain resolves to this cPanel account and that its document root is the deployed public/ directory."
            exit 0
          fi

      - name: Restore maintenance mode if the deploy failed
        # Every step above is allowed to fail loudly; this one decides what a
        # visitor sees afterwards. Anything that dies before the lock is
        # cleared leaves it in place already — writing it again is idempotent —
        # and the health check is `continue-on-error` and only ever exits 0, so
        # a site that merely failed its smoke test keeps serving instead of
        # being sent back to the maintenance page.
        if: failure()
        run: |
          set -euo pipefail
          env_q=$(printf '%q' "$DEPLOY_PATH")
          ssh cpanel "DEPLOY_PATH=$env_q bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH/runtime"
          printf '%s\n' "Deploy failed — the site is being repaired." \
            > "$DEPLOY_PATH/runtime/maintenance.lock"
          chmod 640 "$DEPLOY_PATH/runtime/maintenance.lock"
          echo "Maintenance mode restored; the site shows the maintenance page."
          REMOTE
          echo "::error::Deploy failed. The site is in maintenance mode — re-run this workflow to retry, or clear it with the 'clear_maintenance' dispatch input."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployed to cPanel"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Target | \`${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ env.DEPLOY_PATH }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Health | $HEALTH_URL |"
          } >> "$GITHUB_STEP_SUMMARY"