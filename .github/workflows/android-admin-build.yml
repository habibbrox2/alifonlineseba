name: Android Admin App Build

on:
  push:
    branches: [main]
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-admin-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-admin-build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read
  actions: read

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"'
  # Read by android-admin/app/build.gradle.kts. Left empty here on purpose: a fork's PR
  # must not be able to touch the release keystore, and `if: secrets.X != ''` below
  # already tests them without printing them.
  ADMIN_KEYSTORE_BASE64: ${{ secrets.ADMIN_KEYSTORE_BASE64 }}

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973
          accept-android-sdk-licenses: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-admin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android-admin/gradlew

      - name: Run Ktlint (code style)
        run: cd android-admin && ./gradlew ktlintCheck --no-daemon
        continue-on-error: true

      - name: Run Detekt (static analysis)
        run: cd android-admin && ./gradlew detekt --no-daemon
        continue-on-error: true

      - name: Run unit tests
        run: cd android-admin && ./gradlew testDebugUnitTest --no-daemon

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test
    if: github.event_name == 'push' || github.event.inputs.build_type == 'debug'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973
          accept-android-sdk-licenses: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-admin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android-admin/gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Build Debug APK
        run: cd android-admin && ./gradlew assembleDebug --no-daemon
        env:
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-admin/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test
    if: github.event_name == 'push' || github.event.inputs.build_type == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973
          accept-android-sdk-licenses: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-admin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android-admin/gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Decode release keystore
        id: signing
        env:
          ADMIN_KEYSTORE_BASE64: ${{ secrets.ADMIN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEYSTORE_BASE64}" ]; then
            echo "No ADMIN_KEYSTORE_BASE64 secret: release will build UNSIGNED."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key="$RUNNER_TEMP/admin-release.jks"
          printf '%s' "$ADMIN_KEYSTORE_BASE64" | base64 --decode > "$key"
          keytool -list -v -keystore "$key" \
            -storepass "$ADMIN_STORE_PASSWORD" -alias "$ADMIN_KEY_ALIAS" > /dev/null
          echo "ADMIN_STORE_FILE=$key" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Create keystore.properties from secrets
        if: steps.signing.outputs.signed == 'true'
        run: |
          cat > android-admin/keystore.properties <<EOF
          storeFile=${{ env.ADMIN_STORE_FILE }}
          storePassword=${{ secrets.ADMIN_STORE_PASSWORD }}
          keyAlias=${{ secrets.ADMIN_KEY_ALIAS }}
          keyPassword=${{ secrets.ADMIN_KEY_PASSWORD }}
          EOF

      - name: Build Release APK
        if: steps.signing.outputs.signed == 'true'
        run: cd android-admin && ./gradlew assembleRelease --no-daemon
        env:
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          ADMIN_STORE_FILE: ${{ env.ADMIN_STORE_FILE }}
          ADMIN_STORE_PASSWORD: ${{ secrets.ADMIN_STORE_PASSWORD }}
          ADMIN_KEY_ALIAS: ${{ secrets.ADMIN_KEY_ALIAS }}
          ADMIN_KEY_PASSWORD: ${{ secrets.ADMIN_KEY_PASSWORD }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-admin/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB (for Play Console)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-aab
          path: android-admin/app/build/outputs/bundle/release/*.aab
          retention-days: 30