name: Android Admin App Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'android-admin-v*'
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-admin-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-admin-build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write
  actions: read

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"'
  # Read by android-admin/app/build.gradle.kts. Left empty here on purpose: a fork's PR
  # must not be able to touch the release keystore, and `if: secrets.X != ''` below
  # already tests them without printing them.
  ADMIN_KEYSTORE_BASE64: ${{ secrets.ADMIN_KEYSTORE_BASE64 }}

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973
          accept-android-sdk-licenses: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-admin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android-admin/gradlew

      - name: Run Android lint
        run: cd android-admin && ./gradlew lintDebug --no-daemon

      - name: Run unit tests
        run: cd android-admin && ./gradlew testDebugUnitTest --no-daemon

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event.inputs.build_type == 'debug'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Tags are needed to fall back to the newest version below.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973
          accept-android-sdk-licenses: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-admin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android-admin/gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Determine debug version
        id: version_info
        run: |
          ref="${{ github.ref_name }}"
          clean_ver=$(echo "$ref" | sed -E 's/^(android-admin-)?v//')
          if ! printf '%s' "$clean_ver" | grep -Eq '^[0-9]+(\.[0-9]+)+'; then
            # Branch and PR refs carry no version: use the newest version tag so
            # a build never reports a version older than a shipped release.
            latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
            if [ -z "$latest" ]; then
              latest=$(git tag --list 'android-admin-v[0-9]*' --sort=-v:refname | head -n1)
            fi
            clean_ver=$(printf '%s' "$latest" | sed -E 's/^(android-admin-)?v//')
          fi
          if [ -z "$clean_ver" ]; then clean_ver="0.0.0"; fi
          echo "VERSION_NAME=$clean_ver" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$clean_ver" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: cd android-admin && ./gradlew assembleDebug --no-daemon
        env:
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          APP_VERSION_NAME: ${{ steps.version_info.outputs.VERSION_NAME }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-admin/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Tags are needed to fall back to the newest version below.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973
          accept-android-sdk-licenses: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-admin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android-admin/gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Decode release keystore
        id: signing
        env:
          ADMIN_KEYSTORE_BASE64: ${{ secrets.ADMIN_KEYSTORE_BASE64 }}
          ADMIN_STORE_PASSWORD: ${{ secrets.ADMIN_STORE_PASSWORD }}
          ADMIN_KEY_ALIAS: ${{ secrets.ADMIN_KEY_ALIAS }}
          ADMIN_KEY_PASSWORD: ${{ secrets.ADMIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEYSTORE_BASE64}" ] || [ -z "${ADMIN_STORE_PASSWORD}" ] || [ -z "${ADMIN_KEY_ALIAS}" ] || [ -z "${ADMIN_KEY_PASSWORD}" ]; then
            echo "::error::Release signing secrets are incomplete. Refusing to publish an unsigned APK."
            exit 1
          fi
          key="$RUNNER_TEMP/admin-release.jks"
          printf '%s' "$ADMIN_KEYSTORE_BASE64" | base64 --decode > "$key"
          keytool -list -v -keystore "$key" \
            -storepass "$ADMIN_STORE_PASSWORD" -alias "$ADMIN_KEY_ALIAS" > /dev/null
          echo "ADMIN_STORE_FILE=$key" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Determine release version
        id: version_info
        run: |
          ref="${{ github.ref_name }}"
          if { [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; } && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
            latest="${latest#v}"
            IFS='.' read -r major minor patch <<< "${latest:-0.0.0}"
            major=${major:-0}
            minor=${minor:-0}
            patch=${patch:-0}
            clean_ver="$major.$minor.$((patch + 1))"
          else
            clean_ver=$(echo "$ref" | sed -E 's/^(android-admin-)?v//')
            if ! printf '%s' "$clean_ver" | grep -Eq '^[0-9]+(\.[0-9]+)+'; then
              latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
              if [ -z "$latest" ]; then
                latest=$(git tag --list 'android-admin-v[0-9]*' --sort=-v:refname | head -n1)
              fi
              clean_ver=$(printf '%s' "$latest" | sed -E 's/^(android-admin-)?v//')
            fi
          fi
          if [ -z "$clean_ver" ]; then clean_ver="0.0.0"; fi
          echo "VERSION_NAME=$clean_ver" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$clean_ver" >> "$GITHUB_ENV"

          major=$(echo "$clean_ver" | cut -d. -f1)
          minor=$(echo "$clean_ver" | cut -d. -f2)
          patch=$(echo "$clean_ver" | cut -d. -f3 | sed -E 's/[^0-9].*//')
          major=${major:-1}
          minor=${minor:-0}
          patch=${patch:-0}
          code=$((major * 10000 + minor * 100 + patch))
          echo "VERSION_CODE=$code" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Building version $clean_ver (code $code)"

      - name: Create keystore.properties from secrets
        if: steps.signing.outputs.signed == 'true'
        run: |
          cat > android-admin/keystore.properties <<EOF
          storeFile=${{ env.ADMIN_STORE_FILE }}
          storePassword=${{ secrets.ADMIN_STORE_PASSWORD }}
          keyAlias=${{ secrets.ADMIN_KEY_ALIAS }}
          keyPassword=${{ secrets.ADMIN_KEY_PASSWORD }}
          EOF

      - name: Build Release APK and AAB
        if: steps.signing.outputs.signed == 'true'
        run: cd android-admin && ./gradlew assembleRelease bundleRelease --no-daemon
        env:
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          APP_VERSION_NAME: ${{ steps.version_info.outputs.VERSION_NAME }}
          APP_VERSION_CODE: ${{ steps.version_info.outputs.VERSION_CODE }}
          ADMIN_STORE_FILE: ${{ env.ADMIN_STORE_FILE }}
          ADMIN_STORE_PASSWORD: ${{ secrets.ADMIN_STORE_PASSWORD }}
          ADMIN_KEY_ALIAS: ${{ secrets.ADMIN_KEY_ALIAS }}
          ADMIN_KEY_PASSWORD: ${{ secrets.ADMIN_KEY_PASSWORD }}

      - name: Create and push release tag
        id: release_tag
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          VERSION_NAME: \${{ steps.version_info.outputs.VERSION_NAME }}
        run: |
          set -euo pipefail
          tag="v\${VERSION_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Release tag $tag already exists; refusing to overwrite."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Alif Admin v\${VERSION_NAME}"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-admin/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB (for Play Console)
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android-admin/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.signing.outputs.signed == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/'))
        with:
          tag_name: \${{ steps.release_tag.outputs.tag || github.ref_name }}
          name: Alif Admin v\${{ steps.version_info.outputs.VERSION_NAME }}
          files: |
            android-admin/app/build/outputs/apk/release/*.apk
            android-admin/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
