[versions]
# Android Gradle Plugin 8.13.x is the newest line that still uses the classic
# (non-Variant-API) DSL, and it is the first release that officially accepts
# compileSdk 36. Its floor is Gradle 8.13 + JDK 17 — see gradle/wrapper.
agp = "8.13.2"

# com.google.androidbrowserhelper:androidbrowserhelper is the library Bubblewrap
# generates its projects against. It carries the whole TWA runtime:
# LauncherActivity (Trusted Web Activity), WebViewFallbackActivity and the
# TrustedWebActivityService that hands web-push notifications to Chrome.
# 2.7.3 is the newest stable release; it pulls androidx.core 1.17.0, which is
# the artifact that actually forces compileSdk 36.
browserHelper = "2.7.3"
androidxCore = "1.17.0"

[libraries]
browser-helper = { group = "com.google.androidbrowserhelper", name = "androidbrowserhelper", version.ref = "browserHelper" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
