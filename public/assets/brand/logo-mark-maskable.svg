<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Digital Sheba">
  <!-- Digital Sheba maskable icon: safe zone 40x40 centered (62.5%).
       The mark uses primary green background with gold accent artwork.
       Designed to work when masked to circle/rounded corners by OS. -->
  
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d8f68"/>
      <stop offset="100%" stop-color="#083f31"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5b301"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Full bleed background -->
  <rect width="64" height="64" fill="url(#primaryGrad)"/>
  
  <!-- Main artwork - centered in 40x40 safe zone (12px padding each side) -->
  <g transform="translate(12, 12)" filter="url(#glow)">
    <!-- Abstract "D" shape - left curve (fits in 40x40) -->
    <path d="M4 4 
             C4 1.791 5.791 0 8 0 
             H24 
             C26.209 0 28 1.791 28 4 
             V36 
             C28 38.209 26.209 40 24 40 
             H8 
             C5.791 40 4 38.209 4 36 
             Z" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="3" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- Abstract "S" shape - inner curve -->
    <path d="M16 6 
             C16 3.791 17.791 2 20 2 
             C22.209 2 24 3.791 24 6 
             V16 
             C24 18.209 22.209 20 20 20 
             C17.791 20 16 18.209 16 16 
             V12 
             M12 24 
             C12 21.791 13.791 20 16 20 
             C18.209 20 20 21.791 20 24 
             V34 
             C20 36.209 18.209 38 16 38 
             C13.791 38 12 36.209 12 34" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="2.5" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- Checkmark accent - verification/trust -->
    <path d="M30 16 L34.5 22 L42 10" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.95"/>
    
    <!-- Small dot accent -->
    <circle cx="36" cy="36" r="3" fill="url(#accentGrad)" opacity="0.8"/>
  </g>
</svg>