<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" role="img" aria-label="All Seba">
  <!-- All Seba horizontal lockup, light variant.

       Used on the pages whose background is the primary gradient (login,
       register, the app page), where a primary-900 tile would disappear into
       the backdrop and take its own rounded corner with it. Hence the tile is
       lifted to primary-700 and given a faint white edge, and the tick halo
       is drawn in that same lifted colour rather than in primary-900, or the
       halo would show as a dark smudge on the tile.

       The wordmark is a <text> run, not outlined paths, and that is
       deliberate and permanent. An earlier version drew it as hand-authored
       path outlines; the "lif" of Alif and the final "s" of Tools were simply
       missing and the "o" outline appeared twice, so the lockup rendered as
       "ATOLoi" on the auth pages and on the share card. Hand-outlining a
       wordmark is a bug waiting to happen for any future rename, which is
       exactly what this rename is. If an exact vector lockup is ever needed,
       convert this run with a text-to-outline tool, never by hand.

       SVG loaded through <img> still lays <text> out with the system font
       stack, so this stays one self-contained file with no webfont round
       trip. The card generators do not parse it; they draw the wordmark
       themselves with the same font, so the two paths agree by construction.
       An XML comment cannot contain a double hyphen, so these notes avoid
       it: ET.parse() in the card generators rejects the whole file if one
       sneaks in. -->
  <g>
    <rect width="64" height="64" rx="14" fill="#0b6e51" stroke="#ffffff" stroke-opacity="0.28"/>
    <path d="M34 7 L17 37 L27 37 L24 57 L43 27 L32 27 Z" fill="#f5b301"/>
    <path d="M39 46 L45.5 52 L56 36" fill="none" stroke="#0b6e51" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M39 46 L45.5 52 L56 36" fill="none" stroke="#ffffff" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="84" y="45" fill="#ffffff"
        font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="700" letter-spacing="0.5">All Seba</text>
</svg>