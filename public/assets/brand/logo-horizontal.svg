<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-label="Alif Tools">
  <!-- Alif Tools horizontal lockup: mark + wordmark on transparent background.

       The wordmark is a <text> run, not outlined paths. The previous version
       drew it as seven hand-authored path outlines that were wrong: the "lif"
       of "Alif" and the final "s" of "Tools" were absent and the "o" outline
       was emitted twice, so it rendered as "ATOLoi". Hand-outlining a wordmark
       is what caused that. See logo-horizontal-light.svg for the full note. -->
  <g transform="translate(0,0)">
    <rect width="64" height="64" rx="14" fill="#083f31"/>
    <path d="M36.5 12 L31 12 L23.5 47.5 L29 47.5 Z" fill="#f5b301"/>
    <circle cx="36.5" cy="15.5" r="4" fill="#ffffff"/>
    <rect x="17" y="51" width="30" height="4" rx="2" fill="#ffffff"/>
  </g>
  <text x="84" y="47" fill="#083f31"
        font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="700" letter-spacing="0.5">Alif Tools</text>
</svg>
