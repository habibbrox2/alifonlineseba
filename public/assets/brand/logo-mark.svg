<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Alif Tools">
  <!-- Alif Tools mark: rounded dark-green tile, golden alif stroke with a dot, white baseline bar -->
  <rect width="64" height="64" rx="14" fill="#083f31"/>
  <!-- golden alif: a vertical stroke that leans like the Arabic letter ا -->
  <path d="M36.5 12 L31 12 L23.5 47.5 L29 47.5 Z" fill="#f5b301"/>
  <!-- dot over the alif -->
  <circle cx="36.5" cy="15.5" r="4" fill="#ffffff"/>
  <!-- baseline -->
  <rect x="17" y="51" width="30" height="4" rx="2" fill="#ffffff"/>
</svg>
